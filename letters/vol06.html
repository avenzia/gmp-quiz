    {type:"p", text:{

    {type:"h2", text:{ko:`동시성(Contemporaneous)이 무너지는 순간`, en:`The moment Contemporaneous breaks`, vn:`Khoảnh khắc tính đồng thời sụp đổ`}},

    {type:"figure", img:"img/v06_scene2_review.webp", cap:{

    {type:"p", text:{
      ko:`ALCOA+의 <strong>Contemporaneous(동시성)</strong>는 <strong>행위가 일어난 그 시점에 기록하라</strong>는 원칙입니다. 점검을 했으면 그때 적고, 하지 않았으면 그 사유를 그날 적습니다. 그런데 7월 30일·31일의 'N/A'는 <strong>29일에 작성</strong>되었습니다. 아직 오지 않은 날에 대해, 일어나지도 않은 일을 <strong>미리 단정해 적은 것</strong>입니다.`,
      en:`In ALCOA+, <strong>Contemporaneous</strong> means <strong>record it at the time the activity happens</strong>. If you performed the check, write it then; if you didn't, write the reason on that day. But the 'N/A' for 30 and 31 July was <strong>written on the 29th</strong> — a conclusion recorded <strong>in advance</strong> about days that had not yet come and events that had not yet occurred.`,
      vn:`Trong ALCOA+, <strong>Contemporaneous</strong> nghĩa là <strong>ghi lại ngay tại thời điểm hoạt động diễn ra</strong>. Nếu đã kiểm tra thì ghi ngay lúc đó; nếu không kiểm tra thì ghi lý do trong chính ngày đó. Nhưng chữ 'N/A' cho ngày 30 và 31/7 lại được <strong>viết vào ngày 29</strong> — một kết luận được ghi <strong>trước</strong> về những ngày chưa đến và những việc chưa xảy ra.`}},

    {type:"p", text:{
      ko:`더 큰 문제는 <strong>미래의 불확실한 상황을 단정</strong>했다는 점입니다. 주말에 긴급 시험이 들어왔다면? 다른 분석자가 저울을 썼다면? 정전이나 이상이 생겼다면? 그때 로그북에는 이미 '해당 없음'이라고 적혀 있습니다. <strong>기록이 현실을 앞질러 버리면, 현실이 달라져도 기록은 그대로 남습니다.</strong> 그 순간 로그북은 사실이 아닌 문서가 됩니다.`,
      en:`The deeper issue is that it <strong>asserted an uncertain future as settled</strong>. What if an urgent test had come in over the weekend? What if another analyst had used the balance? What if there'd been a power failure or a malfunction? The logbook would already say 'not applicable'. <strong>When a record runs ahead of reality, reality can change while the record stays put.</strong> At that moment the logbook becomes a document that isn't true.`,
      vn:`Vấn đề sâu xa hơn là nó đã <strong>khẳng định chắc chắn một tương lai chưa chắc chắn</strong>. Nếu cuối tuần có một phép thử khẩn cấp thì sao? Nếu một phân tích viên khác dùng cân thì sao? Nếu mất điện hay có sự cố thì sao? Sổ nhật ký khi đó đã ghi sẵn 'không áp dụng'. <strong>Khi hồ sơ chạy trước thực tế, thực tế có thể đổi thay còn hồ sơ thì vẫn đứng yên.</strong> Ngay khoảnh khắc đó, sổ nhật ký trở thành một tài liệu không đúng sự thật.`}},

    {type:"p", text:{
      ko:`점검자·감사자의 눈에는 더 단순하게 보입니다. <strong>미리 채워진 칸이 하나 발견되면, 그 로그북 전체가 "정말 그때 적은 게 맞나?"라는 의심을 받습니다.</strong> 한 칸의 편의가, 수개월치 기록의 신뢰를 흔드는 셈입니다.`,
      en:`To an inspector or auditor it looks even simpler. <strong>Find one box filled in advance, and the whole logbook invites the question: "was any of this really written at the time?"</strong> One small convenience puts months of records under suspicion.`,
      vn:`Với thanh tra viên hay đánh giá viên, mọi thứ còn đơn giản hơn. <strong>Chỉ cần phát hiện một ô được điền trước, cả cuốn sổ sẽ bị đặt câu hỏi: "liệu có phần nào thực sự được ghi đúng lúc không?"</strong> Một tiện lợi nhỏ khiến hồ sơ hàng tháng trời bị nghi ngờ.`}},

    {type:"h2", text:{ko:`그럼, 어떻게 적어야 할까`, en:`So how should it be recorded?`, vn:`Vậy nên ghi thế nào?`}},

    {type:"figure", img:"img/v06_scene3_talk.webp", cap:{

      en:`Hearing Mr. Trail's explanation, Ms. Han was genuinely surprised. <strong>"I thought leaving no blanks was the more careful thing to do."</strong> Her intention wasn't wrong — only the method was. The right way is simple.`,

    {type:"check", head:{ko:`휴일·미사용일, 이렇게 처리합니다`, en:`Holidays and non-use days — do it this way`, vn:`Ngày nghỉ và ngày không sử dụng — hãy làm thế này`}, items:[
      {ko:`해당 날짜가 <strong>지난 뒤</strong>, 그 사실이 확정된 시점에 기록한다. (예: 휴일이 끝나고 복귀한 날, 해당 칸에 'N/A · 휴일 미사용'으로 기재)`,

      {ko:`일일 점검은 <strong>'사용 전 점검'</strong>이 원칙이다. 사용하지 않은 날은 점검 의무가 없으며, 그 사실을 나중에 남기면 충분하다.`,
       en:`A daily check is fundamentally a <strong>'check before use'</strong>. On days with no use there's no check obligation — noting that fact afterwards is enough.`,
       vn:`Kiểm tra hằng ngày về bản chất là <strong>'kiểm tra trước khi dùng'</strong>. Ngày không sử dụng thì không có nghĩa vụ kiểm tra — ghi lại điều đó sau là đủ.`},
      {ko:`미래 날짜 칸은 <strong>비워 둔다.</strong> 빈칸은 잘못이 아니다. 미리 채운 칸이 잘못이다.`,
       en:`Leave future-dated rows <strong>blank</strong>. A blank is not a fault — a pre-filled box is.`,
       vn:`Hãy để trống các dòng có ngày trong tương lai. Ô trống không phải là lỗi — ô điền trước mới là lỗi.`},
      {ko:`기록 방식이 애매하면 <strong>혼자 판단하지 말고</strong> 팀장·QA에게 묻는다. 묻는 것은 절차의 일부다.`,
       en:`If the recording method is unclear, <strong>don't decide alone</strong> — ask your supervisor or QA. Asking is part of the procedure.`,
       vn:`Nếu chưa rõ cách ghi, <strong>đừng tự quyết định</strong> — hãy hỏi giám sát hoặc QA. Hỏi cũng là một phần của quy trình.`}
    ]},

    {type:"p", text:{
      ko:`이 일 역시 징계가 아니라 <strong>재발 방지</strong>로 이어졌습니다. 로그북 작성 지침에 "미래 날짜 칸 사전 기재 금지"와 "휴일·미사용일 사후 기재 방법"을 명확히 넣고, 팀 전체가 함께 교육했습니다. Ms. Han은 이제 신입에게 이 이야기를 가장 먼저 들려주는 사람이 되었습니다.`,
      en:`This case, too, led not to punishment but to <strong>prevention</strong>. The logbook instructions now state clearly that future-dated rows must not be pre-filled, and how to record holidays and non-use days after the fact; the whole team was trained together. Ms. Han is now the first to tell this story to new hires.`,
      vn:`Vụ việc này cũng dẫn đến <strong>phòng ngừa</strong> chứ không phải kỷ luật. Hướng dẫn ghi sổ nay nêu rõ không được điền trước các dòng ngày tương lai, và cách ghi ngày nghỉ/ngày không sử dụng sau khi sự việc đã qua; cả nhóm được đào tạo cùng nhau. Giờ đây Ms. Han là người đầu tiên kể lại câu chuyện này cho nhân viên mới.`}},

    {type:"h2", text:{ko:`무엇이 핵심인가 — Contemporaneous`, en:`The key idea — Contemporaneous`, vn:`Điều cốt lõi — Contemporaneous`}},

    {type:"reg", rows:[
      {dt:{ko:`원칙`, en:`Principle`, vn:`Nguyên tắc`}, dd:{
        ko:`기록은 <strong>행위가 일어난 그 시점에</strong> 남긴다. 사용하지 않은 날의 'N/A'도 <strong>그 날짜가 지난 뒤</strong> 사실로 확정되었을 때 적는다.`,
        en:`Record <strong>at the time the activity happens</strong>. Even an 'N/A' for a non-use day is written <strong>after that date has passed</strong>, once it is an established fact.`,
        vn:`Ghi lại <strong>ngay tại thời điểm hoạt động diễn ra</strong>. Ngay cả chữ 'N/A' cho ngày không sử dụng cũng chỉ được ghi <strong>sau khi ngày đó đã qua</strong>, khi nó đã là sự thật xác định.`}},
      {dt:{ko:`금지`, en:`Never`, vn:`Không được`}, dd:{
