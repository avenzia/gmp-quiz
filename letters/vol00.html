      en:`Data integrity sounds complex, but the core is simple: <strong>does the record faithfully hold what actually happened?</strong> The principles we call ALCOA+ — Attributable, Legible, Contemporaneous, Original, Accurate, plus Complete, Consistent, Enduring, Available — all exist to protect that one question.`,
      vn:`Tính toàn vẹn dữ liệu nghe có vẻ phức tạp, nhưng cốt lõi rất đơn giản: <strong>bản ghi có phản ánh trung thực điều đã thực sự xảy ra hay không?</strong> Các nguyên tắc ALCOA+ — Attributable, Legible, Contemporaneous, Original, Accurate, cùng với Complete, Consistent, Enduring, Available — đều tồn tại để bảo vệ đúng câu hỏi đó.`}},

      en:`We turned that promise into words that are easy to remember. <strong>3D</strong> is how we work — Honestly, Right, Accurately. <strong>3O</strong> is how we share — Open Record, Open Report, Open Mind. Before any grand system, this attitude is where data integrity begins.`,
      vn:`Chúng tôi đã biến lời cam kết đó thành những từ dễ nhớ. <strong>3D</strong> là cách chúng ta làm việc — Honestly (trung thực), Right (đúng cách), Accurately (chính xác). <strong>3O</strong> là cách chúng ta chia sẻ — Open Record, Open Report, Open Mind. Trước mọi hệ thống lớn lao, chính thái độ này là nơi tính toàn vẹn dữ liệu bắt đầu.`}},

    {type:"quote", text:{

      vn:`"Dữ liệu tốt không bắt đầu từ một hệ thống tốt, mà từ những con người tốt."`}},
