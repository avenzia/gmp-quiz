      en:`QC analyst <strong>Mr. Log</strong> had always filled in the equipment logbook right after use. But that day, chased by an urgent testing schedule, he walked out with his samples and <strong>forgot to write the entry.</strong> It's the kind of slip any person can make. <strong>The real test begins the next morning.</strong>`,
      vn:`Phân tích viên QC <strong>Mr. Log</strong> luôn ghi sổ nhật ký thiết bị ngay sau khi sử dụng. Nhưng hôm đó, bị cuốn theo lịch thử nghiệm gấp, anh cầm mẫu đi ra và <strong>quên ghi vào sổ.</strong> Đó là sơ suất mà bất kỳ ai cũng có thể mắc. <strong>Phép thử thật sự bắt đầu vào sáng hôm sau.</strong>`}},

    {type:"p", text:{
      ko:`Mr. Log의 머릿속에 두 가지 생각이 스쳤습니다. 하나는 <strong>"그냥 어제 날짜로 적어 넣을까"</strong>, 다른 하나는 <strong>"한 줄쯤 비어 있어도 아무도 모르지 않을까"</strong>. 둘 다 유혹적이지만, <strong>둘 다 잘못된 길입니다.</strong>`,
      en:`Two thoughts crossed Mr. Log's mind. One: <strong>"Should I just write it in under yesterday's date?"</strong> The other: <strong>"Would anyone really notice one blank line?"</strong> Both are tempting — and <strong>both are the wrong road.</strong>`,
      vn:`Hai ý nghĩ lướt qua đầu Mr. Log. Một là: <strong>"Hay cứ ghi vào theo ngày hôm qua?"</strong> Hai là: <strong>"Thiếu một dòng thì ai mà để ý?"</strong> Cả hai đều hấp dẫn — và <strong>cả hai đều là con đường sai.</strong>`}},

    {type:"p", text:{
      ko:`어제 날짜로 적는 것은 <strong>기록 위조(backdating)</strong>입니다. 실제로는 오늘 쓴 글씨를 어제 쓴 것처럼 꾸미는 것이니까요. 그렇다고 빈칸으로 두면, 장비는 분명히 사용되었는데 <strong>사용 기록이 존재하지 않는 상태</strong>가 됩니다. 나중에 그 배치에 문제가 생겼을 때, 누가 어떤 장비로 언제 시험했는지 추적할 근거가 사라집니다.`,
      en:`Writing it under yesterday's date is <strong>backdating</strong> — dressing today's handwriting up as yesterday's. But leaving it blank means the equipment was clearly used while <strong>no usage record exists</strong>. If a problem later surfaces with that batch, the basis for tracing who tested what, on which instrument and when, is simply gone.`,
      vn:`Ghi theo ngày hôm qua chính là <strong>ghi lùi ngày (backdating)</strong> — ngụy trang nét chữ của hôm nay thành của hôm qua. Còn để trống thì thiết bị rõ ràng đã được dùng mà <strong>không hề có hồ sơ sử dụng</strong>. Nếu sau này lô đó có vấn đề, cơ sở để truy vết ai đã thử nghiệm gì, trên thiết bị nào, vào lúc nào sẽ biến mất.`}},

    {type:"p", text:{
      ko:`GDP(Good Documentation Practice)의 기본은 <strong>실시간 작성</strong>입니다. 행위가 일어난 그 시점에 기록하는 것이 원칙이죠. 하지만 원칙을 지키지 못했을 때 <strong>"이미 늦었으니 덮는다"가 정답이 되는 것은 아닙니다.</strong> GMP는 완벽한 사람을 요구하지 않습니다. <strong>정직하게 복구하는 절차</strong>를 요구할 뿐입니다.`,
      en:`The foundation of GDP (Good Documentation Practice) is <strong>recording in real time</strong> — at the moment the activity happens. But when that principle has been missed, <strong>"it's too late, so bury it" is not the answer.</strong> GMP doesn't demand perfect people. It demands <strong>an honest way to put things right.</strong>`,
      vn:`Nền tảng của GDP (Thực hành ghi chép tốt) là <strong>ghi theo thời gian thực</strong> — ngay tại thời điểm hoạt động diễn ra. Nhưng khi đã lỡ không làm được điều đó, <strong>"muộn rồi, thôi giấu đi" không phải là câu trả lời.</strong> GMP không đòi hỏi con người hoàn hảo. Nó chỉ đòi hỏi <strong>một cách khắc phục trung thực.</strong>`}},

    {type:"h2", text:{ko:`올바른 길 — Delayed entry(사후 기재)`, en:`The right road — a delayed entry`, vn:`Con đường đúng — Delayed entry (ghi muộn)`}},

    {type:"figure", img:"img/v07_scene2_evidence.webp", cap:{
      ko:`점검 기록, 시험 리포트, 배치 리포트 — 그날 장비를 사용했다는 사실은 여러 곳에 남아 있습니다.`,
      en:`Audit trail, test report, batch report — the fact that the instrument was used that day is recorded in several places.`,
      vn:`Nhật ký kiểm tra, báo cáo thử nghiệm, báo cáo lô — việc thiết bị được dùng hôm đó đã được lưu ở nhiều nơi.`}},

    {type:"p", text:{
      ko:`Mr. Log은 선배 <strong>Ms. Han</strong>에게 솔직히 이야기했습니다. 돌아온 답은 뜻밖에 간단했습니다. <strong>"늦게라도 쓰면 됩니다. 대신 늦었다는 사실까지 같이 쓰세요."</strong> 이것이 <strong>Delayed entry(사후 기재)</strong>입니다.`,
      en:`Mr. Log told his senior, <strong>Ms. Han</strong>, honestly what had happened. The answer was surprisingly simple: <strong>"You can still write it. Just write the fact that it's late, too."</strong> That is a <strong>delayed entry</strong>.`,
      vn:`Mr. Log thành thật kể lại với đàn chị <strong>Ms. Han</strong>. Câu trả lời đơn giản đến bất ngờ: <strong>"Vẫn ghi được. Chỉ cần ghi kèm cả việc nó bị muộn."</strong> Đó chính là <strong>Delayed entry (ghi muộn)</strong>.`}},

    {type:"p", text:{
      ko:`핵심은 두 가지입니다. 첫째, <strong>기재 시점을 숨기지 않는 것</strong> — 오늘 쓴 것이므로 <strong>오늘 날짜와 서명</strong>으로 적고, <strong>왜 실시간으로 기록하지 못했는지 사유(Comment)</strong>를 함께 남깁니다. 둘째, <strong>그날 장비를 실제로 사용했다는 객관적 근거를 확보하는 것</strong> — 혼자만의 기억이 아니라 문서로 뒷받침해야 합니다.`,
      en:`Two things matter. First, <strong>don't hide when you wrote it</strong> — enter it with <strong>today's date and signature</strong>, since that's when you wrote it, and add a <strong>comment explaining why it wasn't recorded in real time</strong>. Second, <strong>secure objective evidence that the instrument really was used that day</strong> — it must rest on documents, not on your memory alone.`,
      vn:`Có hai điểm cốt yếu. Thứ nhất, <strong>đừng che giấu thời điểm ghi</strong> — hãy ghi bằng <strong>ngày hôm nay và chữ ký của hôm nay</strong>, vì đó là lúc bạn viết, kèm theo <strong>lý do (comment) vì sao đã không ghi theo thời gian thực</strong>. Thứ hai, <strong>thu thập bằng chứng khách quan rằng thiết bị thực sự đã được dùng hôm đó</strong> — phải dựa trên tài liệu, không phải chỉ trí nhớ của bạn.`}},

    {type:"check", head:{ko:`사후 기재(Delayed entry), 이렇게 합니다`, en:`How to make a delayed entry`, vn:`Cách thực hiện ghi muộn (Delayed entry)`}, items:[
      {ko:`<strong>빈칸으로 두지 않는다.</strong> 누락을 발견한 즉시 처리한다. 시간이 지날수록 근거 확보가 어려워진다.`,
       en:`<strong>Don't leave it blank.</strong> Act as soon as you notice the gap — the longer you wait, the harder the evidence is to secure.`,
       vn:`<strong>Đừng để trống.</strong> Xử lý ngay khi phát hiện thiếu sót — càng để lâu, bằng chứng càng khó thu thập.`},
      {ko:`<strong>실제 사용일</strong>과 <strong>기재일(오늘)</strong>을 모두 적고, 오늘 날짜로 서명한다. 어제 날짜로 서명하지 않는다.`,
       en:`Record both the <strong>actual date of use</strong> and the <strong>date of entry (today)</strong>, and sign with today's date — never backdate the signature.`,
       vn:`Ghi cả <strong>ngày sử dụng thực tế</strong> và <strong>ngày ghi (hôm nay)</strong>, và ký theo ngày hôm nay — tuyệt đối không ký lùi ngày.`},
      {ko:`비고란에 <strong>사유 Comment</strong>를 남긴다. (예: "시험 일정 지연으로 사용 직후 기재 누락, 익일 사후 기재함")`,
       en:`Add a <strong>comment giving the reason</strong> in the remarks column (e.g. "entry missed at time of use due to schedule pressure; recorded the following day").`,
       vn:`Ghi <strong>comment nêu lý do</strong> vào cột ghi chú (ví dụ: "bỏ sót ghi ngay lúc sử dụng do lịch gấp; ghi bổ sung vào ngày hôm sau").`},
      {ko:`<strong>보조 근거</strong>를 함께 참조한다 — 점검 기록(Audit Trail), 시험 리포트, 배치 리포트, 분석 데이터의 타임스탬프 등.`,
       en:`Reference <strong>supporting evidence</strong> — the audit trail, test report, batch report, timestamps in the analytical data.`,
       vn:`Dẫn chiếu <strong>bằng chứng hỗ trợ</strong> — nhật ký kiểm tra, báo cáo thử nghiệm, báo cáo lô, dấu thời gian trong dữ liệu phân tích.`},
      {ko:`<strong>팀장·QA에게 보고</strong>하고 검토를 받는다. 혼자 조용히 처리하지 않는다. 반복되면 개선이 필요한 신호다.`,
       en:`<strong>Report it to your supervisor and QA</strong> and have it reviewed. Don't quietly handle it alone — if it recurs, that's a signal something needs fixing.`,
       vn:`<strong>Báo cáo cho giám sát và QA</strong> và để họ rà soát. Đừng lặng lẽ tự xử lý — nếu lặp lại, đó là dấu hiệu cần cải tiến.`}
    ]},

    {type:"figure", img:"img/v07_scene3_entry.webp", cap:{
      ko:`비어 있던 줄이 채워집니다. 사유와 오늘 날짜, 서명과 함께 — 감출 것이 없는 기록으로.`,
      en:`The blank line gets filled — with the reason, today's date and a signature. A record with nothing to hide.`,
      vn:`Dòng trống được điền vào — kèm lý do, ngày hôm nay và chữ ký. Một hồ sơ không có gì phải giấu.`}},

    {type:"p", text:{
      ko:`이렇게 남긴 기록은 <strong>흠이 아니라 신뢰의 증거</strong>가 됩니다. 점검자가 보기에도 명확합니다. 누락을 숨긴 기록은 의심을 부르지만, <strong>누락을 스스로 드러내고 근거와 함께 복구한 기록은 그 조직이 데이터를 정직하게 다룬다는 증거</strong>이기 때문입니다.`,
      en:`A record made this way is <strong>not a blemish but evidence of trustworthiness</strong>. To an inspector it reads clearly: a record that hides a gap invites suspicion, while <strong>a record that discloses the gap and restores it with evidence proves the organization handles its data honestly.</strong>`,
      vn:`Một hồ sơ được lập như vậy <strong>không phải vết nhơ mà là bằng chứng của sự đáng tin</strong>. Với thanh tra viên, điều đó rất rõ: hồ sơ che giấu thiếu sót sẽ gây nghi ngờ, còn <strong>hồ sơ tự phơi bày thiếu sót và khôi phục kèm bằng chứng lại chứng minh tổ chức đó xử lý dữ liệu một cách trung thực.</strong>`}},

    {type:"h2", text:{ko:`무엇이 핵심인가 — 실시간 작성과 정직한 복구`, en:`The key idea — real-time recording, honest recovery`, vn:`Điều cốt lõi — ghi theo thời gian thực và khắc phục trung thực`}},

    {type:"reg", rows:[
      {dt:{ko:`원칙`, en:`Principle`, vn:`Nguyên tắc`}, dd:{
        ko:`장비 사용 기록은 <strong>사용 직후 실시간으로</strong> 작성한다(GDP의 기본). 부득이 누락되었다면 <strong>Delayed entry</strong>로 사유·기재일·서명·보조 근거와 함께 복구한다.`,
        en:`Write equipment usage records <strong>in real time, right after use</strong> (the basis of GDP). If an entry was unavoidably missed, restore it as a <strong>delayed entry</strong> with the reason, entry date, signature and supporting evidence.`,
        vn:`Ghi hồ sơ sử dụng thiết bị <strong>theo thời gian thực, ngay sau khi dùng</strong> (nền tảng của GDP). Nếu lỡ bỏ sót, hãy khôi phục bằng <strong>delayed entry</strong> kèm lý do, ngày ghi, chữ ký và bằng chứng hỗ trợ.`}},
      {dt:{ko:`금지`, en:`Never`, vn:`Không được`}, dd:{
        ko:`과거 날짜로 소급 서명(backdating), 누락을 빈칸으로 방치, 기억만으로 추정 기재, 조용히 혼자 메우기.`,
        en:`Backdating a signature, leaving the gap blank, writing from memory alone, quietly filling it in by yourself.`,
        vn:`Ký lùi ngày (backdating), để trống thiếu sót, ghi theo phỏng đoán từ trí nhớ, lặng lẽ tự điền một mình.`}},
      {dt:{ko:`문화`, en:`Culture`, vn:`Văn hóa`}, dd:{
        ko:`<strong>실수는 일어난다. 중요한 것은 그 다음 행동이다.</strong> 누락을 드러내고 바로잡는 사람을 탓하지 않는 문화가, 숨기는 기록을 없앤다.`,
        en:`<strong>Slips happen. What matters is what you do next.</strong> A culture that doesn't punish those who surface and fix a gap is what eliminates hidden records.`,
        vn:`<strong>Sơ suất vẫn xảy ra. Điều quan trọng là hành động tiếp theo.</strong> Một văn hóa không trách phạt người dám nêu ra và sửa chữa thiếu sót chính là điều xóa bỏ những hồ sơ che giấu.`}}
    ], note:`관련 근거 · EU GMP Chapter 4 (문서화) · 21 CFR Part 211 · PIC/S PI 041 · ALCOA+ Principles · Good Documentation Practice (GDP)`},

    {type:"h2", text:{ko:`기억할 한 문장`, en:`One line to remember`, vn:`Một câu để ghi nhớ`}},

    {type:"quote", text:{
