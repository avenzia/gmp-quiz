      en:`It's natural that it feels that way — the audit trail does capture 'who, what, when, why'. But its purpose isn't to suspect people. It's to <strong>make the way data is created and changed trustworthy.</strong> It's less a camera pointed at people, and more a warranty placed on the data.`,

    {type:"h2", text:{ko:`점검 기록이 당신을 지켜줄 때`, en:`When the audit trail protects you`, vn:`Khi nhật ký kiểm tra bảo vệ bạn`}},

      en:`Once, when a batch was questioned, the audit trail showed that ALCOA had worked <strong>at the right time, in the right order</strong>. The doubt vanished on the spot. <strong>Without the record, there would have been no way to prove he'd done it right.</strong>`,
      vn:`Có lần, khi một lô hàng bị nghi vấn, nhật ký kiểm tra cho thấy ALCOA đã thao tác <strong>đúng thời điểm, đúng trình tự</strong>. Nghi ngờ tan biến ngay tại chỗ. <strong>Nếu không có bản ghi, sẽ chẳng có cách nào chứng minh anh đã làm đúng.</strong>`}},

    {type:"quote", text:{

      en:`"The audit trail isn't a camera watching you — it's a witness that vouches for your honesty."`,

    {type:"h2", text:{ko:`올바르게, 함께 쓰는 법`, en:`Using it the right way, together`, vn:`Cùng sử dụng đúng cách`}},
