  intro:{
    ko:`이번 호 주제는 <b>Complete(완전) · Accurate(정확)</b> — 아무리 짧은 중단도 기록되지 않으면, 배치기록서는 더 이상 실제 공정을 담지 못한다는 이야기입니다.`,

      en:`The filling line halts and an amber light comes on. Only two minutes in. Production operator Mr. Fill pauses.`,
      vn:`Dây chuyền chiết rót dừng lại và đèn vàng bật sáng. Mới chỉ hai phút. Nhân viên sản xuất Mr. Fill khựng lại.`}},

    {type:"lead", text:{
      ko:`나쁜 마음은 전혀 없었습니다. Mr. Fill은 <strong>"이제 막 시작했고, 2분밖에 안 됐으니까 괜찮겠지"</strong> 생각했을 뿐입니다. 다시 시작 버튼을 눌렀고, 공정은 정상적으로 끝났습니다. 그리고 그 짧은 멈춤은 어디에도 기록되지 않았습니다.`,
      en:`There was no bad intent at all. Mr. Fill simply thought, <strong>"We just started, it was only two minutes — it's fine."</strong> He pressed start again, and the process finished normally. And that brief stop was never recorded anywhere.`,

    {type:"h2", text:{ko:`"2분이면 괜찮은 줄 알았다"`, en:`"I thought two minutes was fine"`, vn:`"Em tưởng hai phút thì không sao"`}},

    {type:"p", text:{
      ko:`충전(Filling) 공정이 시작된 직후, 장비가 갑자기 멈췄습니다. Mr. Fill은 원인을 간단히 확인하고 다시 가동했습니다. 이후 공정은 문제없이 끝났고, 배치기록서에는 '정상 완료'만 남았습니다. 중단이 있었다는 사실은 어디에도 적히지 않았습니다.`,
      en:`Just after the filling process started, the equipment suddenly stopped. Mr. Fill did a quick check and restarted it. The rest of the run finished without issue, and the batch record showed only 'completed normally'. The fact that there had been a stop was written nowhere.`,
      vn:`Ngay sau khi công đoạn chiết rót bắt đầu, thiết bị bỗng dừng lại. Mr. Fill kiểm tra nhanh rồi khởi động lại. Phần còn lại của mẻ kết thúc suôn sẻ, và hồ sơ lô chỉ ghi 'hoàn thành bình thường'. Việc đã từng có một lần dừng thì không được ghi ở đâu cả.`}},

    {type:"figure", img:"img/v05_scene1_restart.webp", cap:{
      ko:`다시 누른 시작 버튼. 시계는 겨우 2분을 가리킵니다. "이 정도는 그냥 넘어가도 되겠지."`,
      en:`The start button, pressed again. The clock reads just two minutes. "Something this small can just slide, right?"`,
      vn:`Nút khởi động, được nhấn lại. Đồng hồ chỉ vừa hai phút. "Chuyện nhỏ thế này thì cho qua cũng được chứ?"`}},

    {type:"p", text:{
      ko:`Mr. Fill의 판단은 이랬습니다. <strong>"공정이 정상적으로 시작되기 전이었고, 2분밖에 안 됐으니 기록할 일이 아니다."</strong> 하지만 배치기록서는 <strong>실제로 일어난 일을 완전하고 정확하게 담는 문서</strong>입니다. 공정이 시작된 순간부터 벌어진 모든 일 — 중단도, 재시작도 — 은 그 공정의 일부입니다.`,
      en:`Mr. Fill's reasoning was this: <strong>"The process hadn't properly started yet, and it was only two minutes, so there's nothing to record."</strong> But the batch record is the document that captures <strong>what actually happened, completely and accurately</strong>. From the moment the process starts, everything that occurs — the stop, the restart — is part of that process.`,
      vn:`Lập luận của Mr. Fill là: <strong>"Công đoạn chưa thực sự bắt đầu, mà cũng chỉ hai phút, nên chẳng có gì để ghi."</strong> Nhưng hồ sơ lô là tài liệu ghi lại <strong>những gì thực sự đã xảy ra, một cách đầy đủ và chính xác</strong>. Kể từ thời điểm công đoạn bắt đầu, mọi việc diễn ra — lần dừng, lần khởi động lại — đều là một phần của công đoạn đó.`}},

    {type:"p", text:{
      ko:`그런데 Mr. Fill은 이것이 '기록 대상'이라는 것조차 몰랐습니다. 정상 가동 전이라 아직 공정이 아닌 줄 알았기 때문입니다. <strong>가장 흔한 위반은 나쁜 의도가 아니라, 무엇을 기록해야 하는지 몰랐던 순간에서 나옵니다.</strong>`,
      en:`Yet Mr. Fill didn't even realize this was something to record. He thought that, before normal operation, it wasn't 'the process' yet. <strong>The most common breaches come not from bad intent, but from a moment of not knowing what had to be recorded.</strong>`,
      vn:`Vậy mà Mr. Fill thậm chí không nhận ra đây là điều phải ghi lại. Anh nghĩ rằng trước khi vận hành bình thường thì chưa phải là 'công đoạn'. <strong>Những vi phạm phổ biến nhất không đến từ ý đồ xấu, mà từ khoảnh khắc không biết điều gì cần được ghi lại.</strong>`}},

    {type:"h2", text:{ko:`기록에 없으면, 일어나지 않은 일이 된다`, en:`If it isn't in the record, it never happened`, vn:`Nếu không có trong hồ sơ, coi như chưa từng xảy ra`}},

    {type:"figure", img:"img/v05_scene2_review.webp", cap:{
      ko:`배치기록서와 장비 로그를 나란히 놓자, 로그에만 남은 정지 이벤트 한 줄이 눈에 들어옵니다.`,
      en:`Set the batch record beside the equipment log, and one stop event — present only in the log — stands out.`,
      vn:`Đặt hồ sơ lô cạnh nhật ký thiết bị, một sự kiện dừng — chỉ có trong nhật ký — hiện rõ.`}},

    {type:"p", text:{
      ko:`배치기록서 검토 과정에서, 장비의 <strong>이벤트·알람 로그</strong>에는 그날의 정지와 재가동이 시간과 함께 고스란히 남아 있었습니다. 그러나 기록서에는 그 사실이 없었습니다. 로그와 기록서가 서로 다른 이야기를 하고 있었던 것입니다. <strong>사람이 잊은 것을, 장비는 기억하고 있었습니다.</strong>`,
      en:`During batch record review, the equipment's <strong>event and alarm log</strong> still held that day's stop and restart, complete with timestamps. But the record said nothing about it. The log and the record were telling two different stories. <strong>What the person forgot, the equipment remembered.</strong>`,
      vn:`Trong quá trình rà soát hồ sơ lô, <strong>nhật ký sự kiện và cảnh báo</strong> của thiết bị vẫn lưu lần dừng và khởi động lại hôm đó, kèm dấu thời gian. Nhưng hồ sơ lại không hề nhắc đến. Nhật ký và hồ sơ đang kể hai câu chuyện khác nhau. <strong>Điều con người quên, thiết bị vẫn nhớ.</strong>`}},

    {type:"p", text:{
      ko:`왜 이것이 중대한 문제일까요? 그 짧은 중단이 제품에 영향을 주었을 수도 있기 때문입니다. 충전이 잠시 멈춘 동안 어떤 조건이 달라졌는지, 그 배치가 정말 괜찮은지는 <strong>기록이 있어야 평가할 수 있습니다.</strong> 기록이 없으면 평가할 근거 자체가 사라집니다. 그래서 ALCOA+는 <strong>Complete(완전)</strong> — 하나도 빠짐없이 — 와 <strong>Accurate(정확)</strong> — 실제와 일치하게 — 를 요구합니다.`,
      en:`Why does this matter so much? Because that brief stop may have affected the product. Whether any condition changed while filling paused, whether that batch is truly sound — this can only be assessed <strong>if a record exists</strong>. Without the record, the very basis for assessment disappears. That is why ALCOA+ demands <strong>Complete</strong> — nothing omitted — and <strong>Accurate</strong> — matching reality.`,
      vn:`Vì sao điều này lại nghiêm trọng đến vậy? Vì lần dừng ngắn ngủi đó có thể đã ảnh hưởng đến sản phẩm. Liệu có điều kiện nào thay đổi trong lúc chiết rót tạm dừng, liệu lô đó có thực sự ổn — điều này chỉ có thể đánh giá <strong>nếu có hồ sơ</strong>. Không có hồ sơ, chính cơ sở để đánh giá cũng biến mất. Vì thế ALCOA+ yêu cầu <strong>Complete (đầy đủ)</strong> — không bỏ sót — và <strong>Accurate (chính xác)</strong> — khớp với thực tế.`}},

    {type:"h2", text:{ko:`판단하지 말고, 기록하라`, en:`Don't judge it — record it`, vn:`Đừng tự phán xét — hãy ghi lại`}},

    {type:"figure", img:"img/v05_scene3_talk.webp", cap:{
      ko:`"정상 시작 전이라, 기록해야 하는 줄 몰랐어요." Supervisor Ms. D는 다그치지 않습니다.`,
      en:`"It was before normal start — I didn't know I had to record it." Supervisor Ms. D doesn't scold him.`,
      vn:`"Đó là trước khi vận hành bình thường — em không biết phải ghi lại." Giám sát Ms. D không hề trách mắng.`}},

    {type:"p", text:{
      ko:`Supervisor <strong>Ms. D</strong>가 상황을 설명하자 Mr. Fill은 진심으로 놀랐습니다. <strong>"정말 몰랐어요. 정상 시작 전이라 아직 공정이 아닌 줄 알았거든요."</strong> Ms. D는 조용히 말했습니다. "괜찮아요. 중요한 건 이제부터예요. <strong>'너무 짧아서', '아직 시작 전이라' 기록을 건너뛰어도 되는 경우는 없어요.</strong> 영향이 있는지 없는지는 <strong>당신이 아니라 절차가 판단</strong>합니다. 당신의 일은, 있는 그대로 남기는 거예요."`,
      en:`When Supervisor <strong>Ms. D</strong> explained, Mr. Fill was genuinely shocked. <strong>"I really didn't know. I thought it wasn't the process yet, since it was before normal start."</strong> Ms. D said quietly, "It's okay. What matters is from here on. <strong>There is no 'too short' or 'before it started' that lets you skip the record.</strong> Whether it had any impact is judged by <strong>the procedure, not by you</strong>. Your job is to leave it exactly as it happened."`,
      vn:`Khi Giám sát <strong>Ms. D</strong> giải thích, Mr. Fill thực sự sốc. <strong>"Em thật lòng không biết. Em tưởng chưa phải công đoạn, vì đó là trước khi vận hành bình thường."</strong> Ms. D nhẹ nhàng nói: "Không sao. Quan trọng là từ bây giờ. <strong>Không có cái gọi là 'quá ngắn' hay 'chưa bắt đầu' để được phép bỏ qua việc ghi chép.</strong> Việc có ảnh hưởng hay không là do <strong>quy trình phán xét, không phải em</strong>. Việc của em là ghi lại đúng như nó đã xảy ra."`}},

    {type:"p", text:{
      ko:`이 일은 징계가 아니라 <strong>재발 방지</strong>로 이어졌습니다. Deviation 담당 <strong>Ms. April</strong>이 사후 일탈로 정식 평가를 진행했고, "공정 시작 이후 모든 중단·정지는 길이와 관계없이 즉시 기록한다"는 기준을 SOP와 교육에 명확히 반영했습니다. Mr. Fill은 이제 신입에게 이 이야기를 가장 먼저 들려주는 사람이 되었습니다.`,
      en:`This led not to punishment but to <strong>prevention</strong>. Deviation owner <strong>Ms. April</strong> ran a formal retrospective assessment, and the rule — "any stop or interruption after the process starts is recorded immediately, regardless of length" — was written clearly into the SOP and the training. Mr. Fill is now the first to tell this story to new hires.`,
      vn:`Việc này dẫn đến <strong>phòng ngừa</strong> chứ không phải kỷ luật. Người phụ trách sai lệch <strong>Ms. April</strong> tiến hành đánh giá hồi cứu chính thức, và nguyên tắc — "mọi lần dừng hay gián đoạn sau khi công đoạn bắt đầu đều phải ghi ngay, bất kể dài ngắn" — được ghi rõ vào SOP và chương trình đào tạo. Giờ đây Mr. Fill là người đầu tiên kể lại câu chuyện này cho nhân viên mới.`}},

    {type:"hr"},

    {type:"h2", text:{ko:`무엇이 핵심인가 — Complete & Accurate`, en:`The key idea — Complete & Accurate`, vn:`Điều cốt lõi — Complete & Accurate`}},

    {type:"reg", rows:[
      {dt:{ko:`원칙`, en:`Principle`, vn:`Nguyên tắc`}, dd:{
        ko:`공정이 시작된 뒤의 모든 중단·정지·이상은, <strong>아무리 짧아도 발생 즉시 있는 그대로</strong> 배치기록서에 기록한다(Complete·Accurate·Contemporaneous).`,
        en:`Every stop, interruption, or anomaly after the process starts is recorded in the batch record <strong>immediately and as-is, however brief</strong> (Complete, Accurate, Contemporaneous).`,
        vn:`Mọi lần dừng, gián đoạn hay bất thường sau khi công đoạn bắt đầu đều được ghi vào hồ sơ lô <strong>ngay lập tức và đúng nguyên trạng, dù ngắn đến đâu</strong> (Complete, Accurate, Contemporaneous).`}},
      {dt:{ko:`금지`, en:`Never`, vn:`Không được`}, dd:{
        ko:`'짧아서' 또는 '정상 시작 전이라' 기록 생략, 중단 사실 누락, 작업자 혼자 '영향 없음'이라 단정.`,
        en:`Skipping the record because it was 'short' or 'before normal start', omitting the fact of a stop, deciding 'no impact' on your own.`,
        vn:`Bỏ ghi vì 'ngắn' hoặc 'trước khi vận hành bình thường', bỏ sót việc đã dừng, tự mình kết luận 'không ảnh hưởng'.`}},
      {dt:{ko:`문화`, en:`Culture`, vn:`Văn hóa`}, dd:{
        ko:`기록할지 말지는 작업자가 판단하지 않는다. <strong>기록은 의무, 영향 평가는 절차의 몫.</strong> 기록은 감시가 아니라, 우리를 지켜주는 근거다.`,
        en:`Whether to record is not the operator's call. <strong>Recording is the duty; assessing impact is the procedure's job.</strong> The record isn't surveillance — it's the evidence that protects us.`,
        vn:`Ghi hay không ghi không phải là quyết định của người vận hành. <strong>Ghi chép là nghĩa vụ; đánh giá ảnh hưởng là việc của quy trình.</strong> Hồ sơ không phải sự giám sát — mà là bằng chứng bảo vệ chúng ta.`}}
    ], note:`관련 근거 · EU GMP Annex 11 · 21 CFR Part 211 (배치기록) · PIC/S PI 041 · ALCOA+ Principles · Deviation Management`},

    {type:"h2", text:{ko:`기억할 한 문장`, en:`One line to remember`, vn:`Một câu để ghi nhớ`}},

    {type:"quote", text:{
      ko:`"기록에 없으면 하지 않은 것이 된다. 공정이 시작된 순간부터는, 2분도 엄연한 공정이다."`,
      en:`"If it isn't documented, it didn't happen. From the moment the process starts, even two minutes are the process."`,
      vn:`"Nếu không được ghi lại thì coi như chưa từng làm. Kể từ khi công đoạn bắt đầu, hai phút cũng là công đoạn."`}},
