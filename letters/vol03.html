    {type:"quote", text:{

    {type:"reg", rows:[

        en:`Memory reconstructs itself over time. A back-filled entry loses its truthfulness, however accurate it may look.`,
        vn:`Theo thời gian, trí nhớ tự tái dựng lại. Một mục điền sau sẽ mất đi tính trung thực, dù trông có vẻ chính xác đến đâu.`}},
      {dt:{ko:`무엇이 위반인가`, en:`What is a breach`, vn:`Thế nào là vi phạm`}, dd:{
        ko:`메모지·장갑·손바닥에 임시로 적고 나중에 옮겨 적기, "늘 그 값"으로 빈칸 채우기, 작업이 끝난 뒤 한꺼번에 몰아 적기.`,
        en:`Jotting on notes, gloves or palms and transcribing later; filling blanks with "the usual value"; batching all entries after the work is done.`,
        vn:`Ghi tạm lên giấy nhớ, găng tay hay lòng bàn tay rồi chép lại sau; điền ô trống bằng "giá trị thường lệ"; dồn ghi tất cả sau khi đã xong việc.`}}
    ], note:`관련 근거 · EU GMP Annex 11 · 21 CFR Part 11 · PIC/S PI 041 · ALCOA+ Principles`},

    {type:"h2", text:{ko:`ALCOA 씨를 위한 3가지 약속`, en:`Three promises for ALCOA`, vn:`Ba lời hứa dành cho ALCOA`}},

    {type:"check", head:{ko:`현장에서 바로 실천`, en:`Put it into practice on the floor`, vn:`Thực hành ngay tại hiện trường`}, items:[
      {ko:`<strong>적는 시점 = 행동 시점.</strong> 기록에 '이따'는 없습니다. 행동과 동시에 남깁니다.`,
       en:`<strong>Record when you act.</strong> There is no 'later' in recording — write it as it happens.`,
       vn:`<strong>Ghi khi thao tác.</strong> Không có 'để lát nữa' trong việc ghi chép — ghi ngay khi nó diễn ra.`},
      {ko:`<strong>메모지는 기록이 아닙니다.</strong> 임시 메모로 우회하지 말고, 정식 기록 매체에 바로 적습니다.`,
       en:`<strong>A sticky note is not a record.</strong> Don't detour through temporary notes — write directly into the official record.`,
       vn:`<strong>Giấy nhớ không phải là hồ sơ.</strong> Đừng đi đường vòng qua ghi chú tạm — ghi thẳng vào phương tiện hồ sơ chính thức.`},
      {ko:`<strong>기억나지 않으면 추정하지 마세요.</strong> 빈칸은 사실대로, 누락은 정직하게 보고합니다. 정직한 일탈이 거짓된 완성보다 낫습니다.`,
       en:`<strong>If you can't recall, don't estimate.</strong> Keep blanks truthful and report gaps honestly. An honest deviation beats a false completion.`,
       vn:`<strong>Nếu không nhớ, đừng phỏng đoán.</strong> Để ô trống đúng sự thật và báo cáo phần thiếu một cách trung thực. Một sai lệch trung thực còn hơn một hồ sơ hoàn chỉnh giả tạo.`}
    ]},

    {type:"h2", text:{ko:`그래서, 3D 3O`, en:`And so, 3D 3O`, vn:`Và vì thế, 3D 3O`}},

    {type:"p", text:{
      ko:`이번 달 캠페인의 <strong>Open Record</strong>가 바로 이 이야기입니다. 숨기지 않고, 미루지 않고, 있는 그대로 — <strong>지금</strong> 기록하는 것. ALCOA 씨의 노란 메모지가 우리 모두에게 남긴 교훈입니다.`,
      en:`This is exactly what <strong>Open Record</strong> in our campaign means. Don't hide it, don't delay it, write it as it is — <strong>now</strong>. That's the lesson ALCOA's yellow note leaves for all of us.`,
      vn:`Đây chính là ý nghĩa của <strong>Open Record</strong> trong chiến dịch của chúng ta. Đừng giấu, đừng trì hoãn, ghi đúng như nó vốn có — <strong>ngay bây giờ</strong>. Đó là bài học mà tờ giấy nhớ vàng của ALCOA để lại cho tất cả chúng ta.`}},
